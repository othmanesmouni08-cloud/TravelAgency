<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Agency API | Interactive Tester</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --secondary: #ec4899;
        --accent: #8b5cf6;
        --bg: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --success: #10b981;
        --error: #ef4444;
        --border: rgba(255, 255, 255, 0.1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Outfit", sans-serif;
        background-color: var(--bg);
        background-image:
          radial-gradient(
            at 0% 0%,
            rgba(99, 102, 241, 0.15) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 100%,
            rgba(236, 72, 153, 0.15) 0px,
            transparent 50%
          );
        color: var(--text);
        min-height: 100vh;
        line-height: 1.6;
        overflow-x: hidden;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      header {
        text-align: center;
        margin-bottom: 50px;
      }

      h1 {
        font-size: 3rem;
        font-weight: 700;
        background: linear-gradient(to right, #818cf8, #f472b6);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
      }

      .subtitle {
        color: var(--text-muted);
        font-size: 1.1rem;
      }

      /* Tabs System */
      .tabs-container {
        backdrop-filter: blur(12px);
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .tabs-header {
        display: flex;
        background: rgba(15, 23, 42, 0.5);
        border-bottom: 1px solid var(--border);
        padding: 10px;
        gap: 10px;
        overflow-x: auto;
      }

      .tab-btn {
        padding: 12px 24px;
        border-radius: 12px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        white-space: nowrap;
      }

      .tab-btn:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.05);
      }

      .tab-btn.active {
        color: white;
        background: var(--primary);
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      }

      .tabs-content {
        padding: 30px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }

      @media (max-width: 1024px) {
        .tabs-content {
          grid-template-columns: 1fr;
        }
      }

      /* Forms & Inputs */
      .panel {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      h2 {
        font-size: 1.5rem;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .input-group label {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      input,
      select,
      textarea {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 16px;
        color: white;
        font-family: inherit;
        font-size: 1rem;
        transition: all 0.2s;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
      }

      .btn {
        padding: 12px 24px;
        border-radius: 12px;
        border: none;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 1rem;
      }

      .btn-primary {
        background: var(--primary);
        color: white;
      }
      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Response Panel */
      .response-container {
        background: #000;
        border-radius: 20px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        border: 1px solid var(--border);
      }

      .response-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .status-badge {
        padding: 4px 12px;
        border-radius: 99px;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .status-idle {
        background: #334155;
        color: #94a3b8;
      }
      .status-loading {
        background: #92400e;
        color: #fcd34d;
      }
      .status-success {
        background: #065f46;
        color: #6ee7b7;
      }
      .status-error {
        background: #991b1b;
        color: #fca5a5;
      }

      pre {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.9rem;
        color: #d1d5db;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 500px;
        overflow-y: auto;
        padding: 10px;
      }

      /* Data Items */
      .data-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 500px;
        overflow-y: auto;
        padding-right: 10px;
      }

      .data-item {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.2s;
      }

      .data-item:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .data-info h4 {
        margin-bottom: 4px;
      }
      .data-info p {
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .data-actions {
        display: flex;
        gap: 8px;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: none;
        background: rgba(255, 255, 255, 0.05);
        color: white;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: scale(1.1);
      }
      .btn-delete:hover {
        background: var(--error);
      }

      /* Auth Status Bar */
      .auth-bar {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--primary);
        padding: 12px 24px;
        border-radius: 99px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
        z-index: 100;
        cursor: pointer;
      }

      .auth-bar span {
        font-weight: 700;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="container" id="app">
      <header>
        <h1>Travel Agency Terminal</h1>
        <p class="subtitle">Interactive API explorer and management system</p>
      </header>

      <div class="tabs-container">
        <div class="tabs-header">
          <button class="tab-btn active" data-tab="auth">
            🔐 Authentication
          </button>
          <button
            class="tab-btn"
            data-tab="hotels"
            onclick="loadData('hotels')"
          >
            🏨 Hotels
          </button>
          <button class="tab-btn" data-tab="cars" onclick="loadData('cars')">
            🚗 Cars
          </button>
          <button
            class="tab-btn"
            data-tab="activities"
            onclick="loadData('activities')"
          >
            🎭 Activities
          </button>
          <button class="tab-btn" data-tab="bookings">📅 Bookings</button>
        </div>

        <!-- Auth Tab -->
        <div class="tab-pane active" id="auth">
          <div class="tabs-content">
            <div class="panel">
              <h2>Register / Login</h2>
              <div class="input-group">
                <label>Email Address</label>
                <input
                  type="email"
                  id="email"
                  placeholder="john@example.com"
                  value="test@example.com"
                />
              </div>
              <div class="input-group">
                <label>Password</label>
                <input
                  type="password"
                  id="password"
                  placeholder="••••••••"
                  value="Password123!"
                />
              </div>
              <div class="form-grid">
                <button class="btn btn-primary" onclick="handleAuth('login')">
                  Login
                </button>
                <button
                  class="btn btn-secondary"
                  onclick="handleAuth('register')"
                >
                  Register
                </button>
              </div>
              <div
                id="userProfile"
                style="
                  display: none;
                  margin-top: 20px;
                  padding: 20px;
                  background: rgba(255, 255, 255, 0.05);
                  border-radius: 12px;
                "
              >
                <h4 id="profileText">Logged in as: ...</h4>
                <button
                  class="btn btn-secondary"
                  style="margin-top: 10px; width: auto"
                  onclick="logout()"
                >
                  Logout
                </button>
              </div>
            </div>
            <div class="response-container">
              <div class="response-header">
                <span>RAW RESPONSE</span>
                <span class="status-badge status-idle" id="auth-status"
                  >IDLE</span
                >
              </div>
              <pre id="auth-response">{}</pre>
            </div>
          </div>
        </div>

        <!-- Hotels Tab -->
        <div class="tab-pane" id="hotels" style="display: none">
          <div class="tabs-content">
            <div class="panel">
              <h2>Manage Hotels</h2>
              <div class="form-grid">
                <div class="input-group">
                  <label>Hotel Name</label>
                  <input
                    type="text"
                    id="hotelName"
                    placeholder="Royal Palace"
                  />
                </div>
                <div class="input-group">
                  <label>Location</label>
                  <input
                    type="text"
                    id="hotelLocation"
                    placeholder="Marrakech"
                  />
                </div>
              </div>
              <div class="form-grid">
                <div class="input-group">
                  <label>Price per Night ($)</label>
                  <input type="number" id="hotelPrice" value="150" />
                </div>
                <div class="input-group">
                  <label>Rating (1-5)</label>
                  <input
                    type="number"
                    id="hotelRating"
                    value="5"
                    min="1"
                    max="5"
                  />
                </div>
              </div>
              <div class="input-group">
                <label>Available</label>
                <select id="hotelAvailable">
                  <option value="true">True</option>
                  <option value="false">False</option>
                </select>
              </div>
              <button class="btn btn-primary" onclick="createItem('hotels')">
                Add Hotel
              </button>

              <div class="data-list" id="hotels-list">
                <!-- Items here -->
              </div>
            </div>
            <div class="response-container">
              <div class="response-header">
                <span>API FEED</span>
                <span class="status-badge status-idle" id="hotels-status"
                  >IDLE</span
                >
              </div>
              <pre id="hotels-response">{}</pre>
            </div>
          </div>
        </div>

        <!-- Cars Tab -->
        <div class="tab-pane" id="cars" style="display: none">
          <div class="tabs-content">
            <div class="panel">
              <h2>Manage Fleet</h2>
              <div class="form-grid">
                <div class="input-group">
                  <label>Brand</label>
                  <input type="text" id="carBrand" placeholder="Tesla" />
                </div>
                <div class="input-group">
                  <label>Model</label>
                  <input type="text" id="carModel" placeholder="Model 3" />
                </div>
              </div>
              <div class="form-grid">
                <div class="input-group">
                  <label>Seats</label>
                  <input type="number" id="carSeats" value="5" />
                </div>
                <div class="input-group">
                  <label>Transmission</label>
                  <select id="carTransmission">
                    <option value="Automatic">Automatic</option>
                    <option value="Manual">Manual</option>
                  </select>
                </div>
              </div>
              <div class="input-group">
                <label>Price per Day ($)</label>
                <input type="number" id="carPrice" value="80" />
              </div>
              <div class="input-group">
                <label>Available</label>
                <select id="carAvailable">
                  <option value="true">True</option>
                  <option value="false">False</option>
                </select>
              </div>
              <button class="btn btn-primary" onclick="createItem('cars')">
                Add Car
              </button>

              <div class="data-list" id="cars-list"></div>
            </div>
            <div class="response-container">
              <div class="response-header">
                <span>API FEED</span>
                <span class="status-badge status-idle" id="cars-status"
                  >IDLE</span
                >
              </div>
              <pre id="cars-response">{}</pre>
            </div>
          </div>
        </div>

        <!-- Activities Tab -->
        <div class="tab-pane" id="activities" style="display: none">
          <div class="tabs-content">
            <div class="panel">
              <h2>Manage Activities</h2>
              <div class="input-group">
                <label>Title</label>
                <input
                  type="text"
                  id="activityName"
                  placeholder="Desert Safari"
                />
              </div>
              <div class="form-grid">
                <div class="input-group">
                  <label>Category</label>
                  <input
                    type="text"
                    id="activityCategory"
                    placeholder="Adventure"
                  />
                </div>
                <div class="input-group">
                  <label>Price ($)</label>
                  <input type="number" id="activityPrice" value="120" />
                </div>
              </div>
              <div class="input-group">
                <label>Duration</label>
                <input
                  type="text"
                  id="activityDuration"
                  placeholder="4 hours"
                />
              </div>
              <div class="input-group">
                <label>Available</label>
                <select id="activityAvailable">
                  <option value="true">True</option>
                  <option value="false">False</option>
                </select>
              </div>
              <button
                class="btn btn-primary"
                onclick="createItem('activities')"
              >
                Add Activity
              </button>

              <div class="data-list" id="activities-list"></div>
            </div>
            <div class="response-container">
              <div class="response-header">
                <span>API FEED</span>
                <span class="status-badge status-idle" id="activities-status"
                  >IDLE</span
                >
              </div>
              <pre id="activities-response">{}</pre>
            </div>
          </div>
        </div>

        <!-- Bookings Tab -->
        <div class="tab-pane" id="bookings" style="display: none">
          <div class="tabs-content">
            <div class="panel">
              <h2>New Booking</h2>
              <div class="input-group">
                <label>Service Type</label>
                <select id="bookingType">
                  <option value="hotel">Hotel</option>
                  <option value="car">Car</option>
                  <option value="activity">Activity</option>
                </select>
              </div>
              <div class="input-group">
                <label>Item ID (Copy from list)</label>
                <input type="text" id="bookingId" placeholder="65abc..." />
              </div>
              <div class="input-group">
                <label>Customer Name</label>
                <input type="text" id="bookingName" placeholder="John Doe" />
              </div>
              <div class="input-group">
                <label>Customer ID (Optional if logged in)</label>
                <input
                  type="text"
                  id="bookingCustomerId"
                  placeholder="65abc..."
                />
              </div>
              <div class="form-grid">
                <div class="input-group">
                  <label>Start Date</label>
                  <input type="date" id="bookingStart" />
                </div>
                <div class="input-group">
                  <label>End Date</label>
                  <input type="date" id="bookingEnd" />
                </div>
              </div>
              <button class="btn btn-primary" onclick="createBooking()">
                Confirm Booking
              </button>
            </div>
            <div class="response-container">
              <div class="response-header">
                <span>API FEED</span>
                <span class="status-badge status-idle" id="bookings-status"
                  >IDLE</span
                >
              </div>
              <pre id="bookings-response">{}</pre>
            </div>
          </div>
        </div>
      </div>

      <div class="auth-bar" id="authBar" onclick="switchTab('auth')">
        <div
          style="
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
          "
          id="authCircle"
        ></div>
        <span id="authText">GUEST</span>
      </div>
    </div>

    <script>
      // API Base configuration
      const API_BASE = "/api";
      let token = localStorage.getItem("tester_token") || "";

      // Tab Management
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const target = btn.dataset.tab;
          switchTab(target);
        });
      });

      function switchTab(tabId) {
        document
          .querySelectorAll(".tab-pane")
          .forEach((p) => (p.style.display = "none"));
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));

        document.getElementById(tabId).style.display = "block";
        document.querySelector(`[data-tab="${tabId}"]`).classList.add("active");
      }

      // Global Request Helper
      async function apiRequest(
        endpoint,
        method = "GET",
        body = null,
        section = "auth",
      ) {
        const statusBadge = document.getElementById(`${section}-status`);
        const responsePre = document.getElementById(`${section}-response`);

        statusBadge.className = "status-badge status-loading";
        statusBadge.textContent = "PENDING";

        try {
          const headers = { "Content-Type": "application/json" };
          if (token) headers["Authorization"] = `Bearer ${token}`;

          const options = { method, headers };
          if (body) options.body = JSON.stringify(body);

          const response = await fetch(`${API_BASE}${endpoint}`, options);
          let data;

          try {
            data = await response.json();
          } catch (e) {
            data = { message: "Non-JSON response" };
          }

          responsePre.textContent = JSON.stringify(data, null, 2);

          if (response.ok) {
            statusBadge.className = "status-badge status-success";
            statusBadge.textContent = "SUCCESS";
            return data;
          } else {
            statusBadge.className = "status-badge status-error";
            statusBadge.textContent = "ERROR " + response.status;
            return null;
          }
        } catch (error) {
          statusBadge.className = "status-badge status-error";
          statusBadge.textContent = "FAILED";
          responsePre.textContent = error.message;
          return null;
        }
      }

      // Authentication
      async function handleAuth(type) {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const data = await apiRequest(`/auth/${type}`, "POST", {
          email,
          password,
        });

        if (data && data.data && data.data.accessToken) {
          token = data.data.accessToken;
          localStorage.setItem("tester_token", token);
          updateUI();
        }
      }

      function logout() {
        token = "";
        localStorage.removeItem("tester_token");
        updateUI();
      }

      function updateUI() {
        const authBar = document.getElementById("authBar");
        const authText = document.getElementById("authText");
        const authCircle = document.getElementById("authCircle");
        const userProfile = document.getElementById("userProfile");
        const profileText = document.getElementById("profileText");

        if (token) {
          authBar.style.background = "var(--success)";
          authText.textContent = "AUTHENTICATED";
          userProfile.style.display = "block";
          profileText.textContent = "Session Active (JWT Stored)";
        } else {
          authBar.style.background = "var(--primary)";
          authText.textContent = "GUEST";
          userProfile.style.display = "none";
        }
      }

      // Data Management (Hotels, Cars, Activities)
      async function loadData(type) {
        const result = await apiRequest(`/${type}`, "GET", null, type);
        const list = document.getElementById(`${type}-list`);
        const items = result?.data || [];

        list.innerHTML = items.length
          ? items
              .map(
                (item) => `
                <div class="data-item">
                    <div class="data-info">
                        <h4>${item.name || item.brand || "No Name"}</h4>
                        <p>ID: ${item._id || item.id} | $${item.pricePerNight || item.pricePerDay || item.price}</p>
                    </div>
                </div>
            `,
              )
              .join("")
          : '<p style="color: var(--text-muted)">No items found.</p>';
      }

      async function createItem(type) {
        let body = {};
        if (type === "hotels") {
          body = {
            name: document.getElementById("hotelName").value,
            location: document.getElementById("hotelLocation").value,
            pricePerNight: Number(document.getElementById("hotelPrice").value),
            rating: Number(document.getElementById("hotelRating").value),
            available:
              document.getElementById("hotelAvailable").value === "true",
            id: Math.floor(Math.random() * 10000),
          };
        } else if (type === "cars") {
          body = {
            brand: document.getElementById("carBrand").value,
            model: document.getElementById("carModel").value,
            seats: Number(document.getElementById("carSeats").value),
            transmission: document.getElementById("carTransmission").value,
            pricePerDay: Number(document.getElementById("carPrice").value),
            available: document.getElementById("carAvailable").value === "true",
            id: Math.floor(Math.random() * 10000),
          };
        } else if (type === "activities") {
          body = {
            name: document.getElementById("activityName").value,
            Category: document.getElementById("activityCategory").value,
            price: Number(document.getElementById("activityPrice").value),
            duration: document.getElementById("activityDuration").value,
            available:
              document.getElementById("activityAvailable").value === "true",
            id: Math.floor(Math.random() * 10000),
          };
        }

        const data = await apiRequest(`/${type}`, "POST", body, type);
        if (data) loadData(type);
      }

      // Bookings
      async function createBooking() {
        const body = {
          serviceId: document.getElementById("bookingId").value,
          serviceType: document.getElementById("bookingType").value,
          customerName: document.getElementById("bookingName").value,
          customerId: document.getElementById("bookingCustomerId").value,
          startDate: document.getElementById("bookingStart").value,
          endDate: document.getElementById("bookingEnd").value,
        };

        await apiRequest("/bookings", "POST", body, "bookings");
      }

      // Init
      updateUI();
      // Set default dates for booking
      const today = new Date().toISOString().split("T")[0];
      document.getElementById("bookingStart").value = today;
      document.getElementById("bookingEnd").value = today;
    </script>
  </body>
